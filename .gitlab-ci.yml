stages:
  - build
  # - push

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  DOCKER_DRIVER: overlay2
  # DOCKER_HOST: "unix:///var/run/docker.sock"
  # DOCKER_TLS_CERTDIR: ""
  HTTP_PROXY: "http://192.168.1.30:47890"
  HTTPS_PROXY: "http://192.168.1.30:47890"
  NO_PROXY: "localhost,127.0.0.1,docker,dind"

build_image:
  stage: build
  image: docker:latest
  tags:
    - gitlab-runner
  script:
    - export http_proxy=$HTTP_PROXY
    - export https_proxy=$HTTPS_PROXY
    - echo "HTTP_PROXY=$HTTP_PROXY"
    - echo "HTTPS_PROXY=$HTTPS_PROXY"
    - echo "http_proxy=$http_proxy"
    - echo "https_proxy=$https_proxy"
    - docker version
    - docker build -t $(echo ${CI_PROJECT_NAME} | tr '[:upper:]' '[:lower:]'):latest .
  only:
    - develop

