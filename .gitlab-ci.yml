stages:
  - build
  # - push

variables:
  DOCKER_DRIVER: overlay2
  # DOCKER_HOST: "unix:///var/run/docker.sock"
  # DOCKER_TLS_CERTDIR: ""
  HTTP_PROXY: "http://192.168.1.30:47890"
  HTTPS_PROXY: "http://192.168.1.30:47890"
  NO_PROXY: "localhost,127.0.0.1,docker,dind"

build_image:
  stage: build
  image: docker:latest
  tags:
    - gitlab-runner
  script:
    - set -x
    - |
      docker build \
        --build-arg HTTP_PROXY=$HTTP_PROXY \
        --build-arg HTTPS_PROXY=$HTTPS_PROXY \
        --build-arg NO_PROXY=$NO_PROXY \
        -t $(echo ${CI_PROJECT_NAME} | tr '[:upper:]' '[:lower:]'):latest .
  only:
    - develop

