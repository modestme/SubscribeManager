stages:
  - build
  # - push

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  HTTP_PROXY: "http://192.168.1.30:47890"
  HTTPS_PROXY: "http://192.168.1.30:47890"
  NO_PROXY: "localhost,127.0.0.1,docker,dind"

build_image:
  stage: build
  image: docker:latest
  tags:
    - gitlab-runner
  services:
    - docker:dind
  script:
    - docker build -t private/$(echo ${CI_PROJECT_NAME} | tr '[:upper:]' '[:lower:]'):latest .
  only:
    - develop

